name: AdvancedManhunt
main: org.daylight.plugins.manhunt.main.Main
version: 1.7.0
api-version: 1.16
commands:
   mhteam:
      description: Join or leave a manhunt team
      default: true
   mhteams:
      description: Manhunt team creation, configuration and etc.
      default: true
   mhgame:
      description: Start/stop the game or manage it in some way
      default: true
   mhissues:
      description: Special commands
      default: true
   mhw-about:
      description: Display info about the plugin and it's authors
      permission: op
   test:
      description: Test
      permission: op